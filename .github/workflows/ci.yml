name: transport-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  post-shock-study-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the plan without GCP access
        run: >-
          python3 tools/gcp_raw_post_shock_study.py
          --project aurora-raw-plan-validation
          --source-commit "$(git rev-parse HEAD)"
          > post-shock-execution-plan.json
      - name: Reproduce the registered power calculation
        run: >-
          python3 tools/gcp_raw_post_shock_power_analysis.py
          > post-shock-power-analysis.json
      - name: Reproduce the registered repository visuals
        run: >-
          python3 tools/render_raw_host_policy_visuals.py
          --output-dir post-shock-visual-validation
      - name: Reproduce the frozen pilot evidence explorer
        run: >-
          python3 tools/render_raw_host_evidence_explorer.py
          --output post-shock-visual-validation/raw-host-policy-pilot-v1-explorer.html
      - name: Upload frozen design validation
        uses: actions/upload-artifact@v4
        with:
          name: post-shock-study-design-validation
          path: |
            post-shock-execution-plan.json
            post-shock-power-analysis.json
            post-shock-visual-validation/*.svg
            post-shock-visual-validation/*.html
          if-no-files-found: error

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure transport and external-FEC profile
        run: >-
          cmake -S . -B build
          -DBUILD_NET_TOOLS=OFF
          -DUSE_SODIUM=OFF
          -DUSE_RAPTORQ=OFF
          -DUSE_WIREHAIR=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test and enforce benchmark regression gates
        run: ctest --test-dir build -C Release --output-on-failure

  secure-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsodium development headers
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Configure authenticated process profile
        run: >-
          cmake -S . -B build-secure
          -DBUILD_NET_TOOLS=OFF
          -DUSE_SODIUM=ON
          -DUSE_RAPTORQ=OFF
          -DUSE_WIREHAIR=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build authenticated process targets
        run: cmake --build build-secure --config Release --parallel 2
      - name: Test real HMAC process authentication
        run: >-
          ctest --test-dir build-secure -C Release --output-on-failure
          -R 'aurora\.(process_authentication|process_separated_emulation|process_terminal_feedback_recovery|process_policy_pilot_)'

  container-host-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libsodium process-emulation image
        run: >-
          docker build
          --file tests/Dockerfile.process-emulation
          --tag aurora-process-emulation:ci .
      - name: Run authenticated container-host emulation
        run: >-
          bash tests/run_container_host_emulation.sh
          aurora-process-emulation:ci process-host-evidence
      - name: Recover dropped terminal feedback across containers
        run: >-
          bash tests/run_container_host_emulation.sh
          aurora-process-emulation:ci
          process-host-evidence/terminal-recovery
          biological-adaptive smoke-v2 2
          process_zero_delay_forward_v1.trace
          process_terminal_recovery_v3.trace terminal-recovery-v3
      - name: Run policy pilot treatments in one immutable image
        shell: bash
        run: |
          set -euo pipefail
          for policy in fixed-minimum fixed-class-aware biological-adaptive; do
            bash tests/run_container_host_emulation.sh \
              aurora-process-emulation:ci \
              "process-policy-evidence/timed/${policy}" \
              "${policy}" policy-pilot-v1 8 \
              process_timed_v2.trace process_feedback_v2.trace \
              timed-replay-v2
            bash tests/run_container_host_emulation.sh \
              aurora-process-emulation:ci \
              "process-policy-evidence/regime-change/${policy}" \
              "${policy}" policy-pilot-v1 8 \
              process_timed_v2.trace process_feedback_v2.trace \
              regime-change-v1 2
          done
      - name: Upload container-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-container-host-evidence
          path: process-host-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-container-policy-pilot-evidence
          path: process-policy-evidence
          if-no-files-found: error
