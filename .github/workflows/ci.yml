name: transport-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure transport and external-FEC profile
        run: >-
          cmake -S . -B build
          -DBUILD_NET_TOOLS=OFF
          -DUSE_SODIUM=OFF
          -DUSE_RAPTORQ=OFF
          -DUSE_WIREHAIR=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test and enforce benchmark regression gates
        run: ctest --test-dir build -C Release --output-on-failure

  secure-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsodium development headers
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Configure authenticated process profile
        run: >-
          cmake -S . -B build-secure
          -DBUILD_NET_TOOLS=OFF
          -DUSE_SODIUM=ON
          -DUSE_RAPTORQ=OFF
          -DUSE_WIREHAIR=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build authenticated process targets
        run: cmake --build build-secure --config Release --parallel 2
      - name: Test real HMAC process authentication
        run: >-
          ctest --test-dir build-secure -C Release --output-on-failure
          -R 'aurora\.(process_authentication|process_separated_emulation)'

  container-host-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libsodium process-emulation image
        run: >-
          docker build
          --file tests/Dockerfile.process-emulation
          --tag aurora-process-emulation:ci .
      - name: Run authenticated container-host emulation
        run: >-
          bash tests/run_container_host_emulation.sh
          aurora-process-emulation:ci process-host-evidence
      - name: Upload container-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-container-host-evidence
          path: process-host-evidence
          if-no-files-found: error
