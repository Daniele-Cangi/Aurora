name: authenticated-gcp-raw-host-matrix

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_AND_DELETE to authorize the fixed 2x2 GCP matrix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: authenticated-gcp-raw-host-emulation
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    environment: gcp-raw-emulation
    steps:
      - name: Require explicit creation and teardown confirmation
        shell: bash
        env:
          AURORA_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${AURORA_CONFIRM}" = CREATE_AND_DELETE

  raw-host-matrix:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      AURORA_GCP_PROJECT: ${{ vars.GCP_RAW_PROJECT_ID }}
      AURORA_RUN_PREFIX: ghm-${{ github.run_id }}-${{ github.run_attempt }}
      AURORA_EVIDENCE_ROOT: raw-host-evidence/matrix-${{ github.run_id }}-${{ github.run_attempt }}
      AURORA_MATRIX: benchmarks/gcp_raw_region_condition_matrix_v1.json
    steps:
      - uses: actions/checkout@v4

      - name: Validate keyless GCP configuration
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${AURORA_GCP_PROJECT}"
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${GCP_SERVICE_ACCOUNT}"

      - name: Validate the fixed matrix plan before authentication
        shell: bash
        run: |
          python3 tools/gcp_raw_host_matrix.py \
            --matrix "${AURORA_MATRIX}" \
            --project "${AURORA_GCP_PROJECT}" \
            --run-prefix "${AURORA_RUN_PREFIX}" \
            --source-commit "${GITHUB_SHA}" \
            --evidence-root "${AURORA_EVIDENCE_ROOT}"

      - name: Authenticate to GCP with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.AURORA_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.AURORA_GCP_PROJECT }}

      - name: Run and aggregate the authenticated 2x2 matrix
        shell: bash
        run: |
          python3 tools/gcp_raw_host_matrix.py \
            --matrix "${AURORA_MATRIX}" \
            --project "${AURORA_GCP_PROJECT}" \
            --run-prefix "${AURORA_RUN_PREFIX}" \
            --source-commit "${GITHUB_SHA}" \
            --evidence-root "${AURORA_EVIDENCE_ROOT}" \
            --execute \
            --acknowledge-billing-and-teardown

      - name: Repeat exact-run cleanup and audit
        if: always()
        shell: bash
        run: |
          python3 tools/gcp_raw_host_matrix.py \
            --matrix "${AURORA_MATRIX}" \
            --project "${AURORA_GCP_PROJECT}" \
            --run-prefix "${AURORA_RUN_PREFIX}" \
            --source-commit "${GITHUB_SHA}" \
            --evidence-root "${AURORA_EVIDENCE_ROOT}/cleanup-primary" \
            --cleanup-only \
            --acknowledge-billing-and-teardown

      - name: Retain matrix transport and teardown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-gcp-raw-host-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AURORA_EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 14

  independent-cleanup:
    needs: raw-host-matrix
    if: always() && needs.raw-host-matrix.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AURORA_GCP_PROJECT: ${{ vars.GCP_RAW_PROJECT_ID }}
      AURORA_RUN_PREFIX: ghm-${{ github.run_id }}-${{ github.run_attempt }}
      AURORA_EVIDENCE_ROOT: raw-host-evidence/matrix-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
      AURORA_MATRIX: benchmarks/gcp_raw_region_condition_matrix_v1.json
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.AURORA_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.AURORA_GCP_PROJECT }}
      - name: Independently repeat exact-run cleanup and audit
        shell: bash
        run: |
          python3 tools/gcp_raw_host_matrix.py \
            --matrix "${AURORA_MATRIX}" \
            --project "${AURORA_GCP_PROJECT}" \
            --run-prefix "${AURORA_RUN_PREFIX}" \
            --source-commit "${GITHUB_SHA}" \
            --evidence-root "${AURORA_EVIDENCE_ROOT}" \
            --cleanup-only \
            --acknowledge-billing-and-teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-gcp-raw-host-matrix-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AURORA_EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 14
